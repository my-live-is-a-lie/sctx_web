name: Build and deploy SCTX Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web project
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Clone dependencies
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 https://github.com/sc-workshop/Workshop-Core.git workshop-core
          git clone --depth 1 https://github.com/sc-workshop/SupercellTexture.git supercell-texture
          git clone --depth 1 https://github.com/sc-workshop/SupercellCompression.git supercell-compression
          git clone --depth 1 https://github.com/Daniil-SV/SCTX-Converter.git sctx-converter

      - name: Patch dependencies for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail

          # 1. Force NONE ISA for ASTC under Emscripten
          ASTC_FILE="supercell-compression/supercell-compression/cmake/astc.cmake"

          python3 - "$ASTC_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          needle = "if(ANDROID)\n"
          replacement = """if(EMSCRIPTEN)
              set(ASTCENC_ISA_AVX2 OFF)
              set(ASTCENC_ISA_SSE41 OFF)
              set(ASTCENC_ISA_SSE2 OFF)
              set(ASTCENC_ISA_NATIVE OFF)
              set(ASTCENC_ISA_NONE ON)
              set(ASTC_PREFIX "none")
          elseif(ANDROID)
          """

          if needle not in text:
              raise SystemExit("ASTC platform block not found in astc.cmake")

          path.write_text(text.replace(needle, replacement, 1))
          print("ASTC patched for Emscripten")
          PY

          # 2. Force local SupercellTexture inside SCTX-Converter
          DEP_FILE="sctx-converter/cmake/dependencies.cmake"

          python3 - "$DEP_FILE" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          # Match the FetchContent_Declare block for supercell-texture flexibly
          pattern = r'''FetchContent_Declare\(\s*
              supercell-texture\s*
              GIT_REPOSITORY\s+https://github\.com/sc-workshop/SupercellTexture\s*
              GIT_TAG\s+main\s*
          \)\s*
          FetchContent_MakeAvailable\(supercell-texture\)'''

          replacement = '''FetchContent_Declare(
              supercell-texture
              SOURCE_DIR "$ENV{GITHUB_WORKSPACE}/supercell-texture"
          )
          FetchContent_MakeAvailable(supercell-texture)'''

          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.VERBOSE | re.DOTALL)

          if count == 0:
              print("Current content of sctx-converter/cmake/dependencies.cmake:")
              print(text)
              raise SystemExit("Could not find supercell-texture FetchContent block")

          path.write_text(new_text)
          print("SCTX-Converter dependencies patched to use local SupercellTexture")
          PY

          # 3. Force local SupercellCompression inside SupercellTexture
          DEP_FILE2="supercell-texture/cmake/dependencies.cmake"

          python3 - "$DEP_FILE2" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          text = path.read_text()

          pattern = r'''FetchContent_Declare\(\s*
              supercell-compression\s*
              GIT_REPOSITORY\s+https://github\.com/sc-workshop/SupercellCompression\.git\s*
              GIT_TAG\s+main\s*
          \)\s*
          FetchContent_MakeAvailable\(supercell-compression\)'''

          replacement = '''FetchContent_Declare(
              supercell-compression
              SOURCE_DIR "$ENV{GITHUB_WORKSPACE}/supercell-compression"
          )
          FetchContent_MakeAvailable(supercell-compression)'''

          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.VERBOSE | re.DOTALL)

          if count == 0:
              print("Current content of supercell-texture/cmake/dependencies.cmake:")
              print(text)
              raise SystemExit("Could not find supercell-compression FetchContent block")

          path.write_text(new_text)
          print("SupercellTexture dependencies patched to use local SupercellCompression")
          PY

      - name: Build native FlatBuffers compiler
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch v25.12.19 \
            https://github.com/google/flatbuffers.git \
            flatbuffers-native

          cmake \
            -S flatbuffers-native \
            -B flatbuffers-native/build \
            -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DFLATBUFFERS_BUILD_GRPCTEST=OFF \
            -DFLATBUFFERS_BUILD_FLATLIB=OFF \
            -DFLATBUFFERS_BUILD_CPP17=OFF \
            -DFLATBUFFERS_BUILD_LEGACY=OFF \
            -DFLATBUFFERS_BUILD_SHAREDLIB=OFF \
            -DFLATBUFFERS_BUILD_FLATC=ON

          cmake --build flatbuffers-native/build --target flatc --parallel 2

      - name: Configure WebAssembly build
        shell: bash
        run: |
          set -euxo pipefail
          source "$EMSDK/emsdk_env.sh"

          emcmake cmake \
            -S sctx-converter \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSC_TEXTURE_BUILD_CLI=ON \
            -DCMAKE_MODULE_PATH="${GITHUB_WORKSPACE}/workshop-core/workshop-core/cmake" \
            -DFLATBUFFERS_FLATC_EXECUTABLE="${GITHUB_WORKSPACE}/flatbuffers-native/build/flatc"

      - name: Generate SCTX FlatBuffers
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --target GENERATE_SCTX_API --parallel 2 --verbose

      - name: Build SctxConverter
        shell: bash
        run: |
          set -euxo pipefail
          source "$EMSDK/emsdk_env.sh"

          echo "=== Checking generated headers ==="
          find build -name "*_generated.h" -type f || true

          cmake --build build --target SctxConverter --parallel 2 --verbose

      - name: Verify WebAssembly output
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Searching for WASM / JS files ==="
          find build -type f \( -name "*.wasm" -o -name "*.js" -o -name "*.mjs" \) -print

          # Accept common output names
          if [ -f build/SctxConverter.js ] || [ -f build/sctx_converter.js ] || [ -f build/sctx-converter.js ]; then
            echo "Found JS glue file"
          else
            echo "ERROR: No JS glue file found"
            exit 1
          fi

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p site/wasm

          # Keep existing site content if present
          if [ -d "site" ] && [ "$(ls -A site 2>/dev/null | grep -v wasm || true)" ]; then
            echo "Keeping existing site content"
          fi

          # Copy generated WASM artifacts
          find build -type f \( -name "*.wasm" -o -name "*.js" -o -name "*.mjs" \) \
            -exec cp -v {} site/wasm/ \;

          echo "=== Final site contents ==="
          find site -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4