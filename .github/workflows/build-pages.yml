name: Build and deploy SCTX Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web project
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Clone SCTX Converter
        run: |
          git clone --depth 1 https://github.com/Daniil-SV/SCTX-Converter.git sctx-converter

      - name: Configure WebAssembly build
        shell: bash
        run: |
          set -euxo pipefail

          source "$EMSDK/emsdk_env.sh"

          emcmake cmake \
            -S sctx-converter \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSC_TEXTURE_BUILD_CLI=ON

      - name: Generate SCTX FlatBuffers headers
        shell: bash
        run: |
          set -euxo pipefail

          source "$EMSDK/emsdk_env.sh"

          cmake --build build --target GENERATE_SCTX_API

          echo "Generated SCTX headers:"
          find build -type f \
            \( -name "Header_generated.h" -o -name "MipMapData_generated.h" \) \
            -print

      - name: Build SctxConverter
        shell: bash
        run: |
          set -euxo pipefail

          source "$EMSDK/emsdk_env.sh"

          cmake --build build \
            --target SctxConverter \
            --parallel 2

      - name: Copy WebAssembly files
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p site/wasm

          find build -type f \
            \( -name "SctxConverter.js" -o -name "SctxConverter.wasm" \) \
            -exec cp {} site/wasm/ \;

          test -f site/wasm/SctxConverter.js
          test -f site/wasm/SctxConverter.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4