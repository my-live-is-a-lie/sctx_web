name: Build and deploy SCTX Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web project
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Clone dependencies
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 \
            https://github.com/sc-workshop/Workshop-Core.git \
            workshop-core

          git clone --depth 1 \
            https://github.com/sc-workshop/SupercellTexture.git \
            supercell-texture

          git clone --depth 1 \
            https://github.com/Daniil-SV/SCTX-Converter.git \
            sctx-converter

          echo "=== Verify Workshop-Core ==="

          test -f \
            workshop-core/workshop-core/cmake/WkFlatbuffers.cmake

          test -f \
            workshop-core/workshop-core/cmake/WkArgsparse.cmake

          test -f \
            workshop-core/workshop-core/cmake/WkJson.cmake

          echo "=== Verify SupercellTexture ==="

          test -f \
            supercell-texture/supercell-texture/sctx_schemas/MipMapData.fbs

          test -f \
            supercell-texture/supercell-texture/sctx_schemas/Header.fbs

          echo "=== SCTX schemas ==="

          find supercell-texture/supercell-texture/sctx_schemas \
            -type f \
            -name "*.fbs" \
            -print

      - name: Configure WebAssembly build
        shell: bash
        run: |
          set -euxo pipefail

          source "$EMSDK/emsdk_env.sh"

          emcmake cmake \
            -S sctx-converter \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSC_TEXTURE_BUILD_CLI=ON \
            -DCMAKE_MODULE_PATH="${GITHUB_WORKSPACE}/workshop-core/workshop-core/cmake" \
            -DFETCHCONTENT_SOURCE_DIR_SUPERCELL_TEXTURE="${GITHUB_WORKSPACE}/supercell-texture"

      - name: Inspect configured SCTX paths
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Source SCTX schemas ==="

          find supercell-texture/supercell-texture/sctx_schemas \
            -type f \
            -name "*.fbs" \
            -print

          echo "=== Build directories ==="

          find build \
            -maxdepth 5 \
            -type d \
            -iname "*supercell*texture*" \
            -print

          echo "=== MipMapData.fbs locations ==="

          find . \
            -type f \
            -name "MipMapData.fbs" \
            -print

          echo "=== Header.fbs locations ==="

          find . \
            -type f \
            -name "Header.fbs" \
            -print

      - name: Debug SCTX FlatBuffers
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Generated build rules containing MipMapData.fbs ==="

          grep -R -n -A10 -B10 \
            "MipMapData.fbs" \
            build/_deps \
            2>/dev/null \
            || true

          echo "=== Generate SCTX FlatBuffers ==="

          source "$EMSDK/emsdk_env.sh"

          cmake --build build \
            --target GENERATE_SCTX_API \
            --parallel 2 \
            --verbose

      - name: Verify generated headers
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Generated headers ==="

          find build \
            -type f \
            \( \
              -name "Header_generated.h" \
              -o \
              -name "MipMapData_generated.h" \
            \) \
            -print

          test "$(find build -type f -name "Header_generated.h" | wc -l)" -gt 0

          test "$(find build -type f -name "MipMapData_generated.h" | wc -l)" -gt 0

      - name: Build SctxConverter
        shell: bash
        run: |
          set -euxo pipefail

          source "$EMSDK/emsdk_env.sh"

          cmake --build build \
            --target SctxConverter \
            --parallel 2 \
            --verbose

      - name: Verify WebAssembly output
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== WebAssembly files ==="

          find build \
            -type f \
            \( \
              -name "SctxConverter.js" \
              -o \
              -name "SctxConverter.wasm" \
            \) \
            -print

          test "$(find build -type f -name "SctxConverter.js" | wc -l)" -gt 0

          test "$(find build -type f -name "SctxConverter.wasm" | wc -l)" -gt 0

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p site/wasm

          find build \
            -type f \
            \( \
              -name "SctxConverter.js" \
              -o \
              -name "SctxConverter.wasm" \
            \) \
            -exec cp {} site/wasm/ \;

          echo "=== site/wasm ==="

          ls -lh site/wasm

          test -f site/wasm/SctxConverter.js

          test -f site/wasm/SctxConverter.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4