name: Build and deploy SCTX Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web project
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Clone dependencies
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 \
            https://github.com/sc-workshop/Workshop-Core.git \
            workshop-core

          git clone --depth 1 \
            https://github.com/sc-workshop/SupercellTexture.git \
            supercell-texture

          git clone --depth 1 \
            https://github.com/sc-workshop/SupercellCompression.git \
            supercell-compression

          git clone --depth 1 \
            https://github.com/Daniil-SV/SCTX-Converter.git \
            sctx-converter

      - name: Patch SupercellCompression for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail

          ASTC_FILE="supercell-compression/supercell-compression/cmake/astc.cmake"

          python3 - "$ASTC_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          needle = "if(ANDROID)\n"

          replacement = """if(EMSCRIPTEN)
              set(ASTCENC_ISA_AVX2 OFF)
              set(ASTCENC_ISA_SSE41 OFF)
              set(ASTCENC_ISA_SSE2 OFF)
              set(ASTCENC_ISA_NATIVE OFF)
              set(ASTCENC_ISA_NONE ON)
              set(ASTC_PREFIX "none")
          elseif(ANDROID)
          """

          if needle not in text:
              raise SystemExit(
                  "Could not find the expected ASTC platform block in astc.cmake"
              )

          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY

          echo "Patched ASTC configuration:"
          sed -n '1,45p' "$ASTC_FILE"

      - name: Build native FlatBuffers compiler
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 \
            --branch v25.12.19 \
            https://github.com/google/flatbuffers.git \
            flatbuffers-native

          cmake \
            -S flatbuffers-native \
            -B flatbuffers-native/build \
            -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DFLATBUFFERS_BUILD_GRPCTEST=OFF \
            -DFLATBUFFERS_BUILD_FLATLIB=OFF \
            -DFLATBUFFERS_BUILD_CPP17=OFF \
            -DFLATBUFFERS_BUILD_LEGACY=OFF \
            -DFLATBUFFERS_BUILD_SHAREDLIB=OFF \
            -DFLATBUFFERS_BUILD_FLATC=ON

          cmake \
            --build flatbuffers-native/build \
            --target flatc \
            --parallel 2

      - name: Configure WebAssembly build
        shell: bash
        run: |
          set -euxo pipefail

          source "$EMSDK/emsdk_env.sh"

          emcmake cmake \
            -S sctx-converter \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSC_TEXTURE_BUILD_CLI=ON \
            -DCMAKE_MODULE_PATH="${GITHUB_WORKSPACE}/workshop-core/workshop-core/cmake" \
            -DFETCHCONTENT_SOURCE_DIR_SUPERCELL_TEXTURE="${GITHUB_WORKSPACE}/supercell-texture" \
            -DFETCHCONTENT_SOURCE_DIR_SUPERCELL_COMPRESSION="${GITHUB_WORKSPACE}/supercell-compression" \
            -DFLATBUFFERS_FLATC_EXECUTABLE="${GITHUB_WORKSPACE}/flatbuffers-native/build/flatc"

      - name: Generate SCTX FlatBuffers
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build build \
            --target GENERATE_SCTX_API \
            --parallel 2 \
            --verbose

      - name: Build SctxConverter
        shell: bash
        run: |
          set -euxo pipefail

          source "$EMSDK/emsdk_env.sh"

          cmake \
            --build build \
            --target SctxConverter \
            --parallel 2 \
            --verbose

      - name: Verify WebAssembly output
        shell: bash
        run: |
          set -euxo pipefail

          echo "Searching for generated WebAssembly files..."

          find build \
            -type f \
            \( -name "*.wasm" -o -name "*.js" -o -name "*.mjs" \) \
            -print

          test -f build/SctxConverter.js || \
            test -f build/sctx_converter.js || \
            test -f build/sctx-converter.js

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p site

          if [ -d "web" ]; then
            cp -r web/. site/
          elif [ -d "public" ]; then
            cp -r public/. site/
          else
            find . -maxdepth 2 -type f \
              \( -name "index.html" -o -name "*.css" \) \
              -print
          fi

          echo "Contents of site:"
          find site -maxdepth 3 -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4