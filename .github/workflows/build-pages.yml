name: Build and deploy SCTX Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web project
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Clone dependencies
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 https://github.com/sc-workshop/Workshop-Core.git workshop-core
          git clone --depth 1 https://github.com/sc-workshop/SupercellTexture.git supercell-texture
          git clone --depth 1 https://github.com/sc-workshop/SupercellCompression.git supercell-compression
          git clone --depth 1 https://github.com/Daniil-SV/SCTX-Converter.git sctx-converter

      - name: Patch dependencies for WebAssembly
        shell: bash
        run: |
          set -euxo pipefail

          # 1. Patch ASTC for Emscripten
          ASTC_FILE="supercell-compression/supercell-compression/cmake/astc.cmake"

          python3 - "$ASTC_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          needle = "if(ANDROID)\n"

          replacement = """if(EMSCRIPTEN)
              set(ASTCENC_ISA_AVX2 OFF)
              set(ASTCENC_ISA_SSE41 OFF)
              set(ASTCENC_ISA_SSE2 OFF)
              set(ASTCENC_ISA_NATIVE OFF)
              set(ASTCENC_ISA_NONE ON)
              set(ASTC_PREFIX "none")
          elseif(ANDROID)
          """

          if needle not in text:
              raise SystemExit("ASTC platform block not found")

          path.write_text(text.replace(needle, replacement, 1))
          PY

          # 2. Force local SupercellCompression inside SupercellTexture
          DEP_FILE="supercell-texture/cmake/dependencies.cmake"

          python3 - "$DEP_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = """FetchContent_Declare(
              supercell-compression
              GIT_REPOSITORY https://github.com/sc-workshop/SupercellCompression.git
              GIT_TAG main
          )

          FetchContent_MakeAvailable(supercell-compression)"""

          new = """FetchContent_Declare(
              supercell-compression
              SOURCE_DIR "$ENV{GITHUB_WORKSPACE}/supercell-compression"
          )
          FetchContent_MakeAvailable(supercell-compression)"""

          if old not in text:
              # try without extra newlines
              old2 = """FetchContent_Declare(
              supercell-compression
              GIT_REPOSITORY https://github.com/sc-workshop/SupercellCompression.git
              GIT_TAG main
          )
          FetchContent_MakeAvailable(supercell-compression)"""
              if old2 not in text:
                  raise SystemExit("SupercellCompression dependency block not found")
              text = text.replace(old2, new, 1)
          else:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Build native FlatBuffers compiler
        shell: bash
        run: |
          set -euxo pipefail

          git clone --depth 1 --branch v25.12.19 \
            https://github.com/google/flatbuffers.git \
            flatbuffers-native

          cmake \
            -S flatbuffers-native \
            -B flatbuffers-native/build \
            -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DFLATBUFFERS_BUILD_GRPCTEST=OFF \
            -DFLATBUFFERS_BUILD_FLATLIB=OFF \
            -DFLATBUFFERS_BUILD_CPP17=OFF \
            -DFLATBUFFERS_BUILD_LEGACY=OFF \
            -DFLATBUFFERS_BUILD_SHAREDLIB=OFF \
            -DFLATBUFFERS_BUILD_FLATC=ON

          cmake --build flatbuffers-native/build --target flatc --parallel 2

      - name: Configure WebAssembly build
        shell: bash
        run: |
          set -euxo pipefail
          source "$EMSDK/emsdk_env.sh"

          emcmake cmake \
            -S sctx-converter \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSC_TEXTURE_BUILD_CLI=ON \
            -DCMAKE_MODULE_PATH="${GITHUB_WORKSPACE}/workshop-core/workshop-core/cmake" \
            -DFETCHCONTENT_SOURCE_DIR_SUPERCELL_TEXTURE="${GITHUB_WORKSPACE}/supercell-texture" \
            -DFLATBUFFERS_FLATC_EXECUTABLE="${GITHUB_WORKSPACE}/flatbuffers-native/build/flatc"

      - name: Generate SCTX FlatBuffers
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --target GENERATE_SCTX_API --parallel 2 --verbose

      - name: Build SctxConverter
        shell: bash
        run: |
          set -euxo pipefail
          source "$EMSDK/emsdk_env.sh"
          cmake --build build --target SctxConverter --parallel 2 --verbose

      - name: Verify WebAssembly output
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== Looking for WASM/JS files ==="
          find build -type f \( -name "*.wasm" -o -name "*.js" -o -name "*.mjs" \) -print
          # Accept common names
          test -f build/SctxConverter.js || test -f build/sctx_converter.js || test -f build/sctx-converter.js || \
            (echo "No JS glue file found" && exit 1)

      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site

          # Copy existing site content if present
          if [ -d "site" ] && [ "$(ls -A site 2>/dev/null)" ]; then
            echo "Using existing site/ content"
          elif [ -d "web" ]; then
            cp -r web/. site/
          elif [ -d "public" ]; then
            cp -r public/. site/
          fi

          # Copy the generated WASM files
          mkdir -p site/wasm
          find build -type f \( -name "*.wasm" -o -name "*.js" -o -name "*.mjs" \) -exec cp {} site/wasm/ \;

          echo "=== Final site contents ==="
          find site -type f -print

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4