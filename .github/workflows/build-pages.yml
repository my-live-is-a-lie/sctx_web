name: Build and deploy SCTX Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout web project
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.17

      - name: Clone SCTX Converter
        run: |
          git clone --depth 1 --branch 1.2.3 \
            https://github.com/Daniil-SV/SCTX-Converter.git \
            third_party/SCTX-Converter

      - name: Configure WebAssembly build
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"

          emcmake cmake \
            -S third_party/SCTX-Converter \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -I$GITHUB_WORKSPACE/build/_deps/supercell-texture-build/supercell-texture/SCTX_API -I$GITHUB_WORKSPACE/build/_deps/supercell-texture-build/supercell-texture/sctx_schemas/SCTX_API" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -I$GITHUB_WORKSPACE/build/_deps/supercell-texture-build/supercell-texture/SCTX_API -I$GITHUB_WORKSPACE/build/_deps/supercell-texture-build/supercell-texture/sctx_schemas/SCTX_API" \
            -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/build/_deps/workshopcore-src/workshop-core/cmake" \
            -DWK_PREFERRED_CPU_FEATURES=Default \
            -DANDROID=TRUE \
            -DANDROID_PLATFORM_LEVEL=24 \
            -DCMAKE_EXE_LINKER_FLAGS="-sMODULARIZE=1 -sEXPORT_ES6=1 -sENVIRONMENT=web -sALLOW_MEMORY_GROWTH=1 -sEXPORTED_RUNTIME_METHODS=['FS','callMain'] -sEXIT_RUNTIME=0"

      - name: Build SctxConverter
        shell: bash
        run: |
          source "$EMSDK/emsdk_env.sh"

          cmake --build build \
            --target SctxConverter \
            --parallel 2

      - name: Copy WebAssembly files
        shell: bash
        run: |
          mkdir -p site/wasm

          JS_FILE="$(find build -type f -name 'SctxConverter.js' | head -n 1)"
          WASM_FILE="$(find build -type f -name 'SctxConverter.wasm' | head -n 1)"

          test -n "$JS_FILE"
          test -n "$WASM_FILE"

          cp "$JS_FILE" site/wasm/sctx-converter.js
          cp "$WASM_FILE" site/wasm/sctx-converter.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
