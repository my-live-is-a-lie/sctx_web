<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCTX → PNG</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <h1>SCTX → PNG</h1>

    <label class="file-picker">
      <input id="files" type="file" accept=".sctx,.zip" multiple>
      Select SCTX or ZIP files
    </label>

    <button id="convert" disabled>
      Convert
    </button>

    <section class="status">
      <div class="progress-track">
        <div id="progress"></div>
      </div>

      <div id="counter">
        0 / 0
      </div>

      <div id="current">
        Ready
      </div>
    </section>

    <section>
      <h2>Files</h2>
      <ul id="log"></ul>
    </section>

  </main>

  <!-- Sticky download bar -->
  <div id="downloadBar" class="download-bar hidden">
    <button id="downloadAll" class="secondary" disabled>
      Download ZIP
    </button>
  </div>

  <!-- JSZip library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
