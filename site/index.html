<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SCTX → PNG / GLB → OBJ</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <h1>SCTX → PNG / GLB → OBJ</h1>

    <p class="description">
      Convert SCTX textures to PNG and GLB models to OBJ locally in your browser.
    </p>

    <label class="file-picker">
      <input id="files" type="file" accept=".sctx,.glb,.zip" multiple>
      Select SCTX, GLB or ZIP files
    </label>

    <button id="convert" disabled>
      Convert
    </button>

    <section class="status">
      <div class="progress-track">
        <div id="progress"></div>
      </div>

      <div id="counter">
        0 / 0
      </div>

      <div id="current">
        Ready
      </div>
    </section>

    <section>
      <h2>Files</h2>
      <ul id="log"></ul>
    </section>

  </main>

  <div id="downloadBar" class="download-bar hidden">
    <button id="downloadAll" class="secondary" disabled>
      Download
    </button>
  </div>

  <script src="vendor/jszip.min.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
